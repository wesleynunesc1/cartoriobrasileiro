    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O Cartório do Brasileiro é um órgão público ou consulado?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O Cartório do Brasileiro é uma empresa privada de assessoria documental. Atuamos como seu braço operacional para organizar, preencher, validar e acompanhar processos para que você não cometa erros nem perca tempo com exigências burocráticas."
          }
        },
        {
          "@type": "Question",
          "name": "Vocês atendem brasileiros residentes em qualquer estado dos EUA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! Nosso atendimento é 100% digital e preparado para atender brasileiros em qualquer estado dos Estados Unidos (Flórida, Massachusetts, Califórnia, Texas, Nova York, Nova Jersey e demais regiões)."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença entre um documento recebido e um documento conferido?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ao enviar seus arquivos, nossa equipe técnica faz uma análise minuciosa de cada detalhe (datas, grafia de nomes, vigência, nitidez e conformidade com os requisitos dos órgãos receptores) antes de qualquer protocolo oficial."
          }
        },
        {
          "@type": "Question",
          "name": "As taxas dos consulados ou cartórios estão incluídas nos honorários?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Nossos honorários cobrem exclusivamente o serviço de consultoria, organização, preenchimento e acompanhamento especializado. Taxas consulares, cartorárias ou postais são sempre discriminadas e recolhidas diretamente pelos órgãos competentes."
          }
        }
      ]
    }
